# Place this file at .github/workflows/axr-stats.yml in your profile repository.
# Preview mode: @main is MUTABLE. For production, pin a reviewed commit SHA after the stable release.
name: Update AXR Stats
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: axr-stats-update
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: axrobert/axr-stats@main  # PREVIEW ONLY; pin a full commit SHA for production
        with:
          wakatime-oauth-token: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
          theme: midnight
          timezone: America/Maceio
          output: assets/axr-stats
      - name: Commit validated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage only AXR-owned files, including removals after deselection.
          # Globs may fail when a card type has no files, so check each path.
          for filename in lifetime.svg languages.svg activity.svg ranking.svg heatmap.svg emblem.svg lifetime.png emblem.png README-snippet.md; do
            file="assets/axr-stats/$filename"
            if [ -e "$file" ] || git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              git add -A -- "$file"
            fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh AXR Stats cards'
          git push
