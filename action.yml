name: 'AXR Stats — custom profile cards'
description: 'Generate original SVG cards and rank emblems using official WakaTime activity'
author: 'AXR Stats contributors'
inputs:
  wakatime-oauth-token:
    description: 'Personal WakaTime OAuth access token (stored as a GitHub Actions secret)'
    required: true
  theme:
    description: 'Theme: midnight, graphite, aurora'
    required: false
    default: ''
  timezone:
    description: 'IANA timezone (for summaries and day boundaries)'
    required: false
    default: ''
  output:
    description: 'Destination folder in the consuming repository'
    required: false
    default: ''
  config-path:
    description: 'Optional relative JSON settings path, e.g. axr-stats.json. Must NOT contain secrets.'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install raster renderer
      shell: bash
      run: python3 -m pip install --disable-pip-version-check -r "${{ github.action_path }}/requirements-runtime.txt"
    - name: Generate, validate and publish SVGs + PNGs
      shell: bash
      env:
        WAKATIME_OAUTH_TOKEN: ${{ inputs.wakatime-oauth-token }}
        AXR_THEME: ${{ inputs.theme }}
        AXR_TIMEZONE: ${{ inputs.timezone }}
        AXR_OUTPUT: ${{ inputs.output }}
        AXR_CONFIG: ${{ inputs.config-path }}
      run: |
        args=(--assets "${{ github.action_path }}/assets/badges/current")
        if [ -n "$AXR_THEME" ]; then args+=(--theme "$AXR_THEME"); fi
        if [ -n "$AXR_TIMEZONE" ]; then args+=(--timezone "$AXR_TIMEZONE"); fi
        if [ -n "$AXR_OUTPUT" ]; then args+=(--output "$AXR_OUTPUT"); fi
        if [ -n "$AXR_CONFIG" ]; then args+=(--config "$AXR_CONFIG"); fi
        python3 "${{ github.action_path }}/src/run_action.py" "${args[@]}"
