name: AXR Stats CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q src tests
      - run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt
      - run: python -m unittest discover -s tests -v
      - name: Check site JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/ui.js
          node --check site/docs/docs.js
          node --check site/customize/customize.js
          node --check site/customize/preview.js
