name: AXR roadmap icon PNG exports

# Only the maintainers' asset-development branch can write derived PNG exports.
on:
  push:
    branches: [feat/corrected-ranks-roadmap-refine]
    paths:
      - 'site/roadmap/icons/*.svg'
      - 'scripts/build_roadmap_icons.py'
      - '.github/workflows/roadmap-icons-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-original-svg-to-transparent-png:
    if: github.repository == 'axrobert/axr-stats' && github.ref == 'refs/heads/feat/corrected-ranks-roadmap-refine'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install icon renderer
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'CairoSVG>=2.7,<3'
      - name: Render and inspect five original icons
        run: python scripts/build_roadmap_icons.py
      - name: Commit derived transparent PNGs to same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- site/roadmap/icons/*.png
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'chore(assets): export five roadmap icons as transparent PNGs'
          git push origin HEAD:feat/corrected-ranks-roadmap-refine
