name: AXR Stats — GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/generate_preview_cards.py'
      - 'src/axr_stats.py'
      - 'assets/badges/**'
      - 'assets/previews/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare static website
        run: |
          mkdir -p _site/assets/badges/current _site/assets/previews
          cp -r site/. _site/
          python3 scripts/generate_preview_cards.py --output _site/customize/previews
          cp assets/badges/*.png _site/assets/badges/
          cp assets/badges/current/*.png _site/assets/badges/current/
          cp assets/badges/current/*.svg _site/assets/badges/current/
          cp assets/badges/current/ranks.json _site/assets/badges/current/
          cp assets/previews/*.svg _site/assets/previews/
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
