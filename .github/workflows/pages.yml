name: AXR Stats — GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/badges/**'
      - 'assets/previews/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          mkdir -p _site/assets/badges _site/assets/previews
          cp -r site/. _site/
          cp assets/badges/*.svg _site/assets/badges/
          cp assets/badges/*.png _site/assets/badges/
          cp assets/previews/*.svg _site/assets/previews/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
